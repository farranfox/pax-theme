pluginGroup = com.farranfox.pax
pluginVersion = 1.0.0

# Islands UI became the default look in 2025.3 (build 253), which is the
# earliest platform this theme targets.
pluginSinceBuild = 253

# Platform the plugin is built against when no local IDE is given.
platformVersion = 2026.2

# Optional: build and run against an IDE installed on this machine, e.g.
#   platformLocalPath = /Users/me/Applications/WebStorm.app
# Machine-specific, so it usually belongs in ~/.gradle/gradle.properties
# or on the command line as -PplatformLocalPath=...

org.gradle.caching = true
